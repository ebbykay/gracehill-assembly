name: Database validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gracehill_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: gracehill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gracehill_ci -d gracehill_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gracehill_ci:ci-only-password@127.0.0.1:5432/gracehill_test
      GRACEHILL_MIGRATION_TARGET: development
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: bash scripts/migrate-database.sh
      - run: bash scripts/migrate-database.sh
      - run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tests/integration/database.sql
      - name: Detect modified applied migration
        run: |
          sed -i '2i -- synthetic checksum mismatch' database/migrations/0001_editorial_foundation.sql
          if bash scripts/migrate-database.sh; then echo "Expected checksum failure"; exit 1; fi
