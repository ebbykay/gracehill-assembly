name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check.mjs
      - run: node scripts/build-pages.mjs
      - run: node --test tests/integration/pages.test.mjs

      - run: node --test tests/integration/api.test.mjs
      - run: node scripts/build-admin-preview.mjs

      - run: node --test tests/integration/access.test.mjs

      - run: node --test tests/integration/identity-store.test.mjs

      - run: npm install --prefix apps/api --ignore-scripts --no-audit --no-fund
      - run: node --test apps/api/src/token-verifier.test.mjs
      - run: npm audit --prefix apps/api --omit=dev --audit-level=high

      - run: node --test tests/integration/session.test.mjs

      - run: node --test tests/integration/login-attempt.test.mjs
